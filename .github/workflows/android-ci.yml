name: Dhanam AI CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI-only signing keys
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-only-store-password -alias ci-release \
            -keypass ci-only-store-password -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CI Validation Only,O=CI,C=US"

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-configuration-cache

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: Run UI smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Build release APK with ephemeral CI-only signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
          KEY_ALIAS: ci-release
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Enforce offline-only privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml; then
            echo "ERROR: Android app backup must be disabled for local-only financial data"
            exit 1
          fi
          if ! grep -q '<exclude domain="root" path="."' app/src/main/res/xml/backup_rules.xml || ! grep -q '<exclude domain="root" path="."' app/src/main/res/xml/data_extraction_rules.xml; then
            echo "ERROR: backup and device-transfer rules must exclude app data"
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission is forbidden in offline-only builds"
            exit 1
          fi
          if grep -RniE 'com[.]google[.]firebase|FirebaseRemoteConfig|FirebaseAppCheck|Firebase[.]ai|libs[.]firebase|google-services' app/src/main app/build.gradle.kts build.gradle.kts gradle/libs.versions.toml; then
            echo "ERROR: Firebase integration or dependency reference found"
            exit 1
          fi
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-configuration-cache > "$RUNNER_TEMP/release-dependencies.txt"
          if grep -qi 'com[.]google[.]firebase:' "$RUNNER_TEMP/release-dependencies.txt"; then
            echo "ERROR: Firebase artifact found in release runtime dependency graph"
            exit 1
          fi
          echo "Offline-only source, manifest, and dependency checks passed"

      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN_PATH=$(find "$ANDROID_SDK_ROOT/build-tools/" -name zipalign -type f | sort -V | tail -n 1)
          if [ -z "$ZIPALIGN_PATH" ]; then
            echo "ERROR: zipalign tool not found in $ANDROID_SDK_ROOT/build-tools/"
            exit 1
          fi
          "$ZIPALIGN_PATH" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ZIPALIGN_PATH" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk

      - name: Record APK artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %s bytes' app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-evidence
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
