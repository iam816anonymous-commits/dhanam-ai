name: Dhanam AI CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "jules/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI-only signing keys
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-only-store-password -alias ci-release \
            -keypass ci-only-store-password -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CI Validation Only,O=CI,C=US"

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-configuration-cache

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Build release APK with ephemeral CI-only signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
          KEY_ALIAS: ci-release
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN_PATH=$(find "$ANDROID_SDK_ROOT/build-tools/" -name zipalign -type f | sort -V | tail -n 1)
          if [ -z "$ZIPALIGN_PATH" ]; then
            echo "ERROR: zipalign tool not found in $ANDROID_SDK_ROOT/build-tools/"
            exit 1
          fi
          "$ZIPALIGN_PATH" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ZIPALIGN_PATH" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk

      - name: Record APK artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %s bytes' app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-evidence
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
