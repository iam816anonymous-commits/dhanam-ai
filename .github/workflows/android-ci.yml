name: Dhanam AI CI

on:
  push:
    branches: [ "main", "jules/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-configuration-cache

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease --no-configuration-cache || ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
