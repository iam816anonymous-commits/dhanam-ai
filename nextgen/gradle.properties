# Dedicated Gradle settings for the standalone Dhanam Next build.
# The repository's legacy app has its own Gradle configuration. Keep this project
# bounded but large enough for Android Gradle Plugin, Compose, and Room processing.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
